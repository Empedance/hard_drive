# services.hardisk.in -> Spring Boot API on 127.0.0.1:8008
# Cloudflare "Flexible": visitors use HTTPS to Cloudflare, Cloudflare talks plain HTTP to this server.
server {
    listen 80;
    listen [::]:80;
    server_name services.hardisk.in;

    if ($http_x_forwarded_proto = "http") { return 301 https://$host$request_uri; }

    # File bytes go straight to object storage via presigned URLs; the API only receives JSON.
    client_max_body_size 20m;

    location / {
        proxy_pass http://127.0.0.1:8008;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $http_cf_connecting_ip;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        proxy_read_timeout 120s;
    }

    access_log /var/log/nginx/services.hardisk.in.access.log;
    error_log  /var/log/nginx/services.hardisk.in.error.log;
}

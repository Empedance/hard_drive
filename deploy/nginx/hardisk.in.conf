# hardisk.in (landing, Next.js server on 127.0.0.1:3000); www.hardisk.in -> hardisk.in (301)
# Cloudflare "Flexible": visitors use HTTPS to Cloudflare, Cloudflare talks plain HTTP to this server.
server {
    listen 80;
    listen [::]:80;
    server_name www.hardisk.in;

    return 301 https://hardisk.in$request_uri;
}

server {
    listen 80;
    listen [::]:80;
    server_name hardisk.in;

    # Only redirect real plain-HTTP visitors (see X-Forwarded-Proto); an unconditional redirect would loop under Flexible.
    if ($http_x_forwarded_proto = "http") { return 301 https://$host$request_uri; }

    gzip on;
    gzip_vary on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/json application/javascript text/javascript image/svg+xml;

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $http_cf_connecting_ip;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }

    access_log /var/log/nginx/hardisk.in.access.log;
    error_log  /var/log/nginx/hardisk.in.error.log;
}

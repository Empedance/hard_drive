# app.hardisk.in -> static Vite build in ~/hard_drive/hard_drive_frontend/dist
# Cloudflare "Flexible": visitors use HTTPS to Cloudflare, Cloudflare talks plain HTTP to this server.
server {
    listen 80;
    listen [::]:80;
    server_name app.hardisk.in;

    # Only redirect when the visitor came in over plain HTTP (Cloudflare tells us in X-Forwarded-Proto).
    # Never redirect unconditionally: Flexible always connects to the origin over HTTP and it would loop forever.
    if ($http_x_forwarded_proto = "http") { return 301 https://$host$request_uri; }

    root /home/rniyam/hard_drive/hard_drive_frontend/dist;
    index index.html;

    gzip on;
    gzip_vary on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/json application/javascript text/javascript image/svg+xml application/wasm;

    # Hashed build output never changes: cache for a year.
    location /assets/ {
        try_files $uri =404;
        expires 1y;
        add_header Cache-Control "public, immutable";
        add_header X-Content-Type-Options "nosniff" always;
    }

    # Single-page app: unknown paths fall back to index.html, which must never be cached.
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache";
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    }

    access_log /var/log/nginx/app.hardisk.in.access.log;
    error_log  /var/log/nginx/app.hardisk.in.error.log;
}
